<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Retail OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.01em;
        }
        body {
            background: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 50%, #020617 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            padding: 44px 38px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        .login-logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            color: white;
            margin: 0 auto 18px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
        }
        .login-card h4 { font-weight: 800; color: #0f172a; letter-spacing: -0.02em; }
        .login-card .text-muted { font-size: 0.88rem; color: #64748b !important; }
        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.92rem;
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }
        .btn-login {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-weight: 700;
            font-size: 0.95rem;
            width: 100%;
            transition: all 0.25s;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
        }
        .btn-login:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            color: white;
        }
        .form-label { font-size: 0.85rem; font-weight: 700; color: #334155; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-logo"><i class="bi bi-cart3"></i></div>
    <h4 class="text-center mb-1">Smart Retail</h4>
    <p class="text-center text-muted mb-4">Supermarket Manager Portal</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger py-2 px-3" style="font-size:0.85rem;border-radius:10px;">
                <i class="bi bi-exclamation-circle me-1"></i>{{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0" style="border-radius:12px 0 0 12px;border:1.5px solid #e2e8f0;">
                    <i class="bi bi-person text-muted"></i>
                </span>
                <input type="text" name="username" class="form-control border-start-0" placeholder="Enter manager username" required style="border-radius:0 12px 12px 0;">
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0" style="border-radius:12px 0 0 12px;border:1.5px solid #e2e8f0;">
                    <i class="bi bi-lock text-muted"></i>
                </span>
                <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required style="border-radius:0 12px 12px 0;">
            </div>
        </div>
        <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard
        </button>
    </form>

    <div class="text-center text-muted mt-4 mb-0" style="font-size:0.75rem;">
        🔒 Secure Enterprise Inventory System
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</body>
</html>
